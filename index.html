<!DOCTYPE html>
<html lang="en">
<head>

<title>Land of Doodads</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%231a120c'/%3E%3Crect x='1' y='2' width='5' height='4' fill='%23c9873c'/%3E%3Crect x='1' y='1' width='3' height='1' fill='%23c9873c'/%3E%3Crect x='2' y='4' width='3' height='1' fill='%237a4a1c'/%3E%3Crect x='4' y='2' width='1' height='1' fill='%23000000'/%3E%3Crect x='6' y='3' width='2' height='1' fill='%23f3cc84'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=d40d808e2b">

<body>
  <div id="stage">
    <!-- everything except the doodads is drawn at 480x270 and nearest-neighbour upscaled -->
    <canvas id="bgCanvas" width="480" height="270"></canvas>
    <!-- the doodads themselves are drawn at full device resolution, smooth -->
    <canvas id="charCanvas"></canvas>
    <canvas id="fgCanvas" width="480" height="270"></canvas>
  </div>

  <!-- the ?v= on every link is a fingerprint of that file, written by
       tools/build_single_file.py: a changed file gets a new address, so a
       refresh after a push never runs the last push's scripts -->
  <script src="js/core.js?v=a6e9af491e"></script>
  <script src="js/font.js?v=1b4ffa4fdb"></script>
  <script src="js/input.js?v=bbced6eba4"></script>
  <script src="js/audio.js?v=25d4a9dcc4"></script>
  <script src="js/screen.js?v=bab6a3d8ef"></script>
  <script src="js/assets.js?v=d2c5c6f872"></script>
  <script src="js/doodads.js?v=6f62d3f957"></script>
  <script src="js/cover.js?v=f5efd42b21"></script>
  <script src="js/coop.js?v=c4509c15c1"></script>
  <script src="js/garden.js?v=4743704f12"></script>
  <script src="js/deck.js?v=36b8d3156d"></script>
  <script src="js/canopy.js?v=72b0b7cab4"></script>
  <script src="js/construction.js?v=fd7045a3b9"></script>
  <!-- the Living Room: the room itself, then its five bays, then levels.js,
       which is where they are named. Load order is the dependency order.
       chalkboard.js is not a bay - it is the second art module the
       Whiteboard swaps in, and it sits after whiteboard.js because it
       aliases that module's plotters (and the room's) at load, while
       Whiteboard.build() only reaches Chalkboard.build() at boot.
       cupmen.js is not a bay either: it is the Fort's second module, the
       Cupmen and their pellets, and it sits before fort.js because fort.js
       aliases its palette at load while Fort.build() reaches Cupmen.build()
       only at boot. -->
  <script src="js/livingroom.js?v=e1726d4fc8"></script>
  <script src="js/desk.js?v=477fbbf7f8"></script>
  <script src="js/couch.js?v=e217e148e8"></script>
  <script src="js/mantle.js?v=2c184a99f5"></script>
  <script src="js/whiteboard.js?v=17b00e86d1"></script>
  <script src="js/chalkboard.js?v=3044704942"></script>
  <script src="js/cupmen.js?v=e40f65884a"></script>
  <script src="js/fort.js?v=55634e7cc7"></script>
  <!-- the Dining Room: the room itself, then its five bays, in the same
       dependency order. diningroom.js reads LivingRoom.P at load (it is
       the same house - the same ceiling, the same oak), so it sits after
       livingroom.js; every bay reads DiningRoom at load. tv.js is last
       because its set broadcasts every bay before it: it reads their
       baked sprites and calls their covers. -->
  <script src="js/diningroom.js?v=e67c93bfb3"></script>
  <script src="js/table.js?v=b459398320"></script>
  <script src="js/floor.js?v=8695ac372f"></script>
  <script src="js/bar.js?v=6d72697e47"></script>
  <script src="js/ceiling.js?v=a718d267dc"></script>
  <script src="js/tv.js?v=2821503ef9"></script>
  <!-- the Kitchen: the room itself, then its five bays. kitchen.js reads
       DiningRoom.P at load (the same house, through the doorway), so it
       sits after the Dining Room; every bay reads Kitchen at load. -->
  <script src="js/kitchen.js?v=ad32ce5c7b"></script>
  <script src="js/island.js?v=49442f0eb3"></script>
  <script src="js/counter.js?v=dfda11038b"></script>
  <script src="js/fridge.js?v=d91fae2dbe"></script>
  <script src="js/cabinets.js?v=56ffd080dd"></script>
  <script src="js/dishwasher.js?v=175a035fb1"></script>
  <script src="js/levels.js?v=05afa3b7de"></script>
  <script src="js/scores.js?v=938e8fb784"></script>
  <script src="js/world.js?v=1937498283"></script>
  <script src="js/ui.js?v=fdcdd60a7c"></script>
  <!-- Achievements and their badges. The badges are baked from UI.C and from
       the levels' own tiles, and the roster reads the house high score off
       scores.js as it is built, so both sit after everything they ask a
       question of - badges after ui.js, the roster after scores.js. -->
  <script src="js/badges.js?v=5263744954"></script>
  <script src="js/achievements.js?v=4dafc5cad6"></script>
  <script src="js/scene_title.js?v=eac9a26278"></script>
  <script src="js/scene_porch.js?v=7c9f80f831"></script>
  <script src="js/scene_stands.js?v=065c75df39"></script>
  <script src="js/scene_levelselect.js?v=f8fc6593a3"></script>
  <script src="js/scene_charselect.js?v=ea3fc63fb7"></script>
  <script src="js/scene_play.js?v=405457a498"></script>
  <script src="js/scene_scores.js?v=7c08d41d03"></script>
  <script src="js/scene_achievements.js?v=24e5d1b193"></script>
  <script src="js/game.js?v=be7ddcfed6"></script>
</body>
</html>
